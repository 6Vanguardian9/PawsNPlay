version: "3.9"

services:

  backend:
    build: .
    container_name: paws_backend
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - postgres
      - redis
      - ollama
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pawsdb
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app

  postgres:
    image: postgres:15
    container_name: paws_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pawsdb
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    container_name: paws_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  redis:
    image: redis
    container_name: paws_redis
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama
    container_name: paws_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  qdrant_storage:
  ollama_data:
